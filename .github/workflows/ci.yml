name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Formatting
        run: scripts/format.sh --check
      - name: Tests
        run: scripts/test.sh
      - name: Build the app
        run: scripts/build-app.sh
